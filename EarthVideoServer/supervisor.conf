; EarthVideo API - Supervisor Configuration
; 用法：
;   1. 将本文件软链或复制到 /etc/supervisor/conf.d/earthvideo.conf
;   2. supervisorctl reread && supervisorctl update
;   3. supervisorctl start earthvideo
;
; 日志位置：/var/log/supervisor/earthvideo-*

[program:earthvideo]
directory=/data/code/movie/EarthVideoServer
; 使用 .venv 虚拟环境的 Python
command=/data/code/movie/EarthVideoServer/.venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8808

; 使用哪个用户运行
user=root
umask=022

; 开机自启动
autostart=true
autorestart=true

; 启动重试
startsecs=5
startretries=3

; 停止信号
stopsignal=INT
stopwaitsecs=10

; 日志
stdout_logfile=/var/log/supervisor/earthvideo-out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/var/log/supervisor/earthvideo-err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

; 环境变量
environment=PYTHONUNBUFFERED="1"

# EarthVideo API - Nginx Configuration
# Domain: movie.increns.cn
# Backend: localhost:8808
# External: 9908 (HTTPS)

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name movie.increns.cn;
    return 301 https://$host:9908$request_uri;
}

# HTTPS server
server {
    listen 9908 ssl http2;
    listen [::]:9908 ssl http2;
    server_name movie.increns.cn;

    # SSL certificates — 请替换为实际证书路径
    ssl_certificate     /etc/ssl/certs/movie.increns.cn.pem;
    ssl_certificate_key /etc/ssl/private/movie.increns.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 日志
    access_log  /var/log/nginx/movie.access.log;
    error_log   /var/log/nginx/movie.error.log;

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8808;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # HLS 代理流接口
    location /api/proxy/hls {
        proxy_pass http://127.0.0.1:8808;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8808/api/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态文件（如果有前端）
    location / {
        return 404;
    }
}
